services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-katiebeauty}
      POSTGRES_USER: ${POSTGRES_USER:-katiebeauty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-katiebeauty} -d ${POSTGRES_DB:-katiebeauty}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - katiebeauty-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-katiebeauty}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-katiebeauty}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN must be set}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@katiebeauty.hu}
      ADMIN_NAME: ${ADMIN_NAME:-Katie Beauty Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - katiebeauty-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  katiebeauty-network:
    driver: bridge

volumes:
  pgdata:
